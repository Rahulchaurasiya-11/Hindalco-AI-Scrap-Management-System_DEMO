<!DOCTYPE html>
<html>
    <head>
        <title>Hindalco - Recycling Management</title>
        <link rel="stylesheet" href="../css/style.css">
  
  
  <style>
    /* --- Base Theme (Aapke Existing Dark Color Scheme Par Based) --- */
    :root {
        --bg-main: #0d1117;        /* Puraana dark background */
        --bg-sidebar: #161b22;     /* Sidebar ka color */
        --accent-blue: #1f6feb;    /* Recycle button ka blue color */
        --accent-hover: #388bfd;   /* Button hover color */
        --text-main: #c9d1d9;      /* Standard text color */
        --text-white: #ffffff;
        --border-color: #21262d;   /* Inputs aur tables ke borders */
        --input-bg: #0d1117;       /* Input box background */
    }


    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    body {
        background-color: var(--bg-main);
        color: var(--text-main);
        display: flex;
        min-height: 100vh;
    }

 /* --- Sidebar Navigation Styling --- */

   
 /* --- Main Content Area Styling --- */
 .main {
    margin-left: 240px;
    flex: 1;
    padding: 40px;
    max-width: 1200px;
}




/* --- Forms and Inputs Configuration --- */
.form-container {
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 100%;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.form-group label {
    font-size: 13px;
    color: #8b949e;
    font-weight: 500;
}
input {
    width: 100%;
    background-color: var(--input-bg);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    color: var(--text-white);
    padding: 12px;
    font-size: 14px;
    transition: border-color 0.2s ease;
}

input:focus {
    border-color: var(--accent-blue);
    outline: none;
}







 /* Button design original primary blue jaisa hi rakha hai */
 button {
    background-color: var(--accent-blue);
    color: var(--text-white);
    border: none;
    padding: 12px;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s ease;
    margin-top: 8px;
}

button:hover {
    background-color: var(--accent-hover);
}






 /* --- Modern Tables Layout --- */
 table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
    border: 1px solid var(--border-color);
    background-color: var(--bg-sidebar);
    border-radius: 6px;
    overflow: hidden;
}

th, td {
    padding: 12px 16px;
    text-align: left;
    border-bottom: 1px solid var(--border-color);
}

th {
    background-color: #1f242c;
    color: var(--text-white);
    font-size: 14px;
    font-weight: 600;
}

td {
    font-size: 14px;
    color: var(--text-main);
}
tr:last-child td {
    border-bottom: none;
}

/* Dynamic status indication */
.log-item {
    display: flex;
    align-items: center;
    gap: 8px;
}

.bullet-dot {
    width: 6px;
    height: 6px;
    background-color: #238636; /* Processed/Recycled Green indicator */
    border-radius: 50%;
}





  </style>
  
  
    </head>

    <body>

        <!-- <div class="sidebar">
            <h2>Hindalco</h2> -->

        <div class="sidebar">
            <!-- <div class="sidebar-brand"></div> -->
            <!-- <div class="brand"> -->
                <div class="sidebar-brand">

                <h2>Hindalco</h2>
                </div>
                <!-- <p class="subtitle">Scrap Portal</p> -->
            <!-- </div> -->


                <nav class="sidebar-menu">

                <a href="dashboard.html">Dashboard</a>
                <a href="scrap-log.html">Scrap Log</a>
                <a href="inventory.html">Inventory</a>
                <a href="recycling.html" class="active">Recycling</a>
                <a href="prediction.html">Prediction</a>
                <a href="reports.html">Reports</a>










                <div class="sidebar-footer">
                    <span class="user-name">Rahul Chaurasiya</span> <!-- Yahan apna asli naam likhein -->
                    <a href="#" onclick="logout()" class="logout-btn">Logout</a>
                </div>
            </nav>
        <!-- </div> -->
</div>


<!-- Main Content Area -->
<div class="main">
    <header class="main-header">
        <h1>Recycle Scrap Process</h1>
        <p class="description">Convert logged industrial scrap into reusable warehouse inventory.</p>
    </header>

    <!-- Form Card Section -->
    <div class="card form-card">
        <h3>Log New Recycling Activity</h3>
        <div class="form-group">
            <label for="scrapId">Scrap Reference ID</label>
            <input type="text" id="scrapId" placeholder="e.g. 64f1b2c3e4b0c5123456789a">
        </div>
        
        <div class="form-group">
            <label for="material">Output Recycled Material</label>
            <input type="text" id="material" placeholder="e.g. Aluminum Ingot Premium">
        </div>
        
        <div class="form-group">
            <label for="quantity">Quantity Processed (MT)</label>
            <input type="number" id="quantity" placeholder="e.g. 150">
        </div>

        <button class="btn-primary" onclick="recycleScrap()">
            Confirm & Recycle Scrap
        </button>
    </div>


 <!-- Logs Table Section -->
 <div class="card table-card">
    <h3>Recent Recycling Logs</h3>
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Material Type</th>
                    <th>Processed Quantity</th>
                </tr>
            </thead>
            <tbody id="recyclingTable">
                <!-- Dynamic rows will render here -->
            </tbody>
        </table>
    </div>
</div>
</div>

<script src="../js/recycling.js"></script>
</body>
</html>
