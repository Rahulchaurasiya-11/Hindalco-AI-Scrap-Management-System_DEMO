<!DOCTYPE html>
<html>
    <head>
        <title>Scrap Log</title>
        <link rel="stylesheet" href="../css/style.css">
        <style>
    .form-container {
        background: #242526;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 25px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .form-group {
        margin-bottom: 15px;
    }
    .form-group label {
        display: block;
        margin-bottom: 5px;
        color: #ccc;
        font-weight: bold;
    }
    .form-container input, .form-container select, .form-container button {
        width: 100%;
        padding: 10px;
        border-radius: 4px;
        border: 1px solid #444;
        background: #18191a;
        color: #fff;
        box-sizing: border-box;
    }
    .form-container button {
        background: #2ecc71;
        color: white;
        font-weight: bold;
        cursor: pointer;
        border: none;
        margin-top: 10px;
        transition: background 0.2s;
    }
    .form-container button:hover {
        background: #27ae60;
    }
    .records-container {
        background: #242526;
        padding: 20px;
        border-radius: 8px;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
    }
    th, td {
        border: 1px solid #444;
        padding: 12px;
        text-align: left;
        color: white;
    }

    th {
        background-color: #3a3b3c;
    }
    tr:nth-child(even) {
        background-color: #2d2e30;
    }
    .delete-btn {
        background: #e74c3c;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
    }
    .delete-btn:hover {
        background: #c0392b;
    }
    #search {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border-radius: 4px;
        border: 1px solid #444;
        background: #18191a;
        color: white;
    }

</style>
    </head>

    <body>

        <div class="sidebar">
            <div class="sidebar-brand">

            <h2>Hindalco</h2>
            </div>
            <nav class="sidebar-menu">
            <a href="dashboard.html">Dashboard</a>
            <a href="scrap-log.html" class="active">Scrap Log</a>
            <a href="inventory.html">Inventory</a>
            <a href="recycling.html">Recycling</a>
            <a href="prediction.html">Prediction</a>
            <a href="reports.html">Reports</a>



            <div class="sidebar-footer">
                <span class="user-name">Rahul Chaurasiya</span> <!-- Yahan apna asli naam likhein -->
                <a href="#" onclick="logout()" class="logout-btn">Logout</a>
            </div>
</nav>
        </div>

        <div class="main">
            <h1>Scrap Management</h1>

        <!-- 🆕 Clean Add New Scrap Form Section -->

            <div class="form-container">
                <h2>Add New Scrap</h2>
                <div class="form-group">
                    <label>Scrap Item Name</label>
                    <input type="text" id="scrapName" placeholder="e.g., Damaged Aluminum Wire">
                </div>
                
                <div class="form-group">
                    <label>Material Type</label>
                    <select id="scrapType">
                        <option value="Aluminum">Aluminum</option>
                        <option value="Copper">Copper</option>
                        <option value="Steel">Steel</option>
                        <option value="Hazardous">Hazardous</option>
                    </select>
                </div>
    
                <div class="form-group">
                    <label>Weight (in KG)</label>
                    <input type="number" id="weight" placeholder="e.g., 450">
                </div>
    
                <div class="form-group">
                    <label>Origin Department</label>
                    <select id="department">
                        <option value="">Loading...</option>
                    </select>
                </div>



                <button onclick="addScrap()">➕ Add Scrap Entry</button>
            </div>


<!-- 🆕 Records Display Section -->
<div class="records-container">
    <h2>Scrap Records</h2>
    <input type="text" id="search" placeholder="🔍 Search records by name..." onkeyup="filterTable()">
    
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Type</th>
                <th>Weight</th>
                <th>Department</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="scrapTable">
            <!-- Data JavaScript se yahan load hoga -->
        </tbody>
    </table>
</div>













            

        </div>

        <script src="../js/scrap.js"></script>

    </body>
</html>
